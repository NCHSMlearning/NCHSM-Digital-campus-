<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a2a3b"><title>NCHSM | Academic Records</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#1b5267 0,#0a2a3b 48%,#061a27 100%);color:#172b3b}.login-shell{width:min(100%,460px);background:#fff;border-radius:24px;padding:clamp(24px,5vw,42px);box-shadow:0 24px 80px #00131f66}.brand{text-align:center;margin-bottom:28px}.brand-icon{width:66px;height:66px;border-radius:20px;margin:0 auto 15px;display:grid;place-items:center;background:#fff4dc;color:#b97808;font-size:28px}.brand h1{font-size:23px;margin:0;color:#0a2a3b}.brand p{margin:8px 0 0;color:#667786;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:18px 0 8px;color:#294052}.field{position:relative}.field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7890a0}.field input{width:100%;padding:14px 14px 14px 42px;border:1px solid #d9e1e8;border-radius:12px;font:inherit;font-size:14px;outline:none}.field input:focus{border-color:#d79a2c;box-shadow:0 0 0 3px #f5b04230}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:24px;background:#0a2a3b;color:white;font:700 14px Inter;cursor:pointer}button:hover{background:#123e52}button:disabled{opacity:.6;cursor:wait}.error{display:none;background:#fff0f0;color:#b42318;border:1px solid #ffd2d2;padding:12px;border-radius:10px;font-size:13px;margin:16px 0}.hint{margin-top:20px;padding:14px;border-radius:12px;background:#f4f7f9;color:#526879;font-size:12px;line-height:1.65;text-align:center}.hint strong{color:#1b3a4f}</style></head>
<body><main class="login-shell"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-folder-tree"></i></div><h1>NCHSM Academic Records</h1><p>Document Records Management System<br>Institutional access for lecturers, reviewers and administrators</p></div><div id="errorMsg" class="error" role="alert" aria-live="polite"></div><form id="loginForm" autocomplete="on"><label for="email">Institutional email</label><div class="field"><i class="fa-regular fa-envelope"></i><input type="email" id="email" name="username" placeholder="Your NCHSM portal email" autocomplete="username" required></div><label for="password">Password</label><div class="field"><i class="fa-solid fa-lock"></i><input type="password" id="password" name="password" placeholder="Your portal password" autocomplete="current-password" required></div><button id="loginButton" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in with my NCHSM account</button></form><div class="hint"><strong>One institutional account.</strong><br>Use the same email and password as your Lecturer or Super Admin portal. Your role and permissions are checked against your NCHSM profile.</div></main>
<script>
const SUPABASE_URL='https://lwhtjozfsmbyihenfunw.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3aHRqb3pmc21ieWloZW5mdW53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2NTgxMjcsImV4cCI6MjA3NTIzNDEyN30.7Z8AYvPQwTAEEEhODlW6Xk-IR1FK3Uj5ivZS7P17Wpk';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const allowedRoles=['lecturer','hod','nursing_hod','tvet_hod','admin','superadmin','super_admin','academic_registrar','registrar','student'];
function normalizeRole(v){return String(v??'').normalize('NFKC').trim().toLowerCase().replace(/[\\s-]+/g,'_').replace(/_+/g,'_');}
function showError(m){const e=document.getElementById('errorMsg');e.textContent=m;e.style.display='block';}
async function validateAndEnter(user){
 if(!user)throw new Error('Please sign in with your institutional account.');
 const fields='user_id,email,full_name,role,program,intake_year,block,status,login_enabled';
 let {data:p,error}=await sb.from('consolidated_user_profiles_table').select(fields).eq('user_id',user.id).maybeSingle();
 if(error)throw new Error('Unable to verify your NCHSM profile: '+error.message);
 if(!p&&user.email){const byEmail=await sb.from('consolidated_user_profiles_table').select(fields).ilike('email',user.email.trim()).maybeSingle();if(byEmail.error)throw new Error('Unable to verify your NCHSM profile: '+byEmail.error.message);p=byEmail.data;}
 if(!p)throw new Error('Your account has no NCHSM profile. Contact the administrator.');
 const rawRole=String(p.role??'').normalize('NFKC').trim().toLowerCase();
 const role=normalizeRole(rawRole);
 const compactRole=rawRole.replace(/[^a-z]/g,'');
 const isSuperAdmin=compactRole==='superadmin';
 const authorised=isSuperAdmin||allowedRoles.includes(role)||allowedRoles.includes(rawRole);
 if(!authorised)throw new Error('Your NCHSM profile role ('+(p.role||'not set')+') is not authorised for Academic Records. Ask an administrator to correct the role.');
 if(p.login_enabled===false)throw new Error('Portal access is disabled for this account.');
 if(!['active','approved'].includes(String(p.status||'').trim().toLowerCase()))throw new Error('Your account is not active or approved. Contact the administrator.');
 window.location.replace('drms_dashboard.html?v=20261102b');
}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('loginButton');document.getElementById('errorMsg').style.display='none';b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw new Error('Invalid email or password. Use your NCHSM portal credentials.');await validateAndEnter(data.user);}catch(err){showError(err.message||'Unable to sign in.');b.disabled=false;b.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Sign in with my NCHSM account';}});
(async()=>{const {data:{user},error}=await sb.auth.getUser();if(!error&&user){try{await validateAndEnter(user);}catch(e){await sb.auth.signOut();}}})();
</script><script src="js/login-maintenance.js?v=20261111"></script>
</body></html>
