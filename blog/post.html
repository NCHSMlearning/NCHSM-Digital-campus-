        // ============================================
        // 🎯 GET POST FROM URL AND DISPLAY
        // ============================================
        function loadPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug || !blogPosts[slug]) {
                document.getElementById('blogPostContent').innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 40px; color: #FDB913;"></i>
                        <h2 style="color: #0A3D62; margin-top: 10px;">Post Not Found</h2>
                        <p style="color: #94a3b8;">The post you're looking for doesn't exist.</p>
                        <a href="/blog/" style="display: inline-block; margin-top: 20px; color: #0A3D62; font-weight: 600;">← Back to Blog</a>
                    </div>
                `;
                return;
            }

            const post = blogPosts[slug];

            document.getElementById('blogPostContent').innerHTML = `
                <div class="category">${post.category}</div>
                <h1>${post.title}</h1>
                <div class="meta">
                    <span><i class="far fa-calendar-alt"></i> ${post.date}</span>
                    <span><i class="far fa-clock"></i> ${post.readTime}</span>
                    <span><i class="far fa-user"></i> ${post.author}</span>
                </div>
                <img class="featured-image" src="${post.image}" alt="${post.title}">
                <div class="content">
                    ${post.content}
                </div>
                <a href="/blog/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Blog</a>
            `;

            // Update page title
            document.title = `${post.title} | NCHSM Blog`;
            // Update meta description
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
                metaDesc.content = post.content.replace(/<[^>]*>/g, '').substring(0, 150) + '...';
            }

            // ✅ Track page view with Google Analytics
            if (typeof gtag !== 'undefined') {
                gtag('event', 'page_view', {
                    'page_title': post.title,
                    'page_path': '/blog/post.html?slug=' + slug
                });
            }
        }

        // ============================================
        // 🚀 LOAD POST ON PAGE LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
