name: Build NCHSM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unified-digital-campus-mobile
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
      - 'mobile/**'

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor config compiler
        run: npx tsc --version

      - name: Stage web assets outside the Android project
        run: |
          rm -rf /tmp/nchsm-web
          mkdir -p /tmp/nchsm-web
          rsync -a ./ /tmp/nchsm-web/ \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='android/' \
            --exclude='www/' \
            --exclude='.github/' \
            --exclude='release/'
          rm -rf www
          mv /tmp/nchsm-web www

      - name: Generate Android native project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NCHSM-Digital-Campus-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
