<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NCHSM Academic Transcript Verification</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

    <style>
        /* ----------------------------------------------
            RESET & BASE
        ------------------------------------------------ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(10, 61, 98, 0.03) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(253, 185, 19, 0.05) 0%, transparent 50%);
        }

        /* ----------------------------------------------
            MAIN CARD
        ------------------------------------------------ */
        .container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 40px 32px;
            box-shadow: 0 25px 60px rgba(10, 61, 98, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            position: relative;
            overflow: hidden;
        }

        /* subtle accent line */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #0A3D62, #FDB913, #0A3D62);
            background-size: 200% 100%;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ----------------------------------------------
            HEADER
        ------------------------------------------------ */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 22px;
            margin-bottom: 28px;
            border-bottom: 2px solid #f1f5f9;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0A3D62, #1a5a7a);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #FDB913;
            box-shadow: 0 4px 12px rgba(10, 61, 98, 0.2);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #0A3D62;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .logo-text span {
            color: #FDB913;
        }

        .logo-sub {
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.3px;
            margin-top: 1px;
        }

        .badge {
            margin-left: auto;
            background: linear-gradient(135deg, #0A3D62, #1a5a7a);
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(10, 61, 98, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge i {
            color: #FDB913;
            font-size: 10px;
        }

        /* ----------------------------------------------
            STATUS / CONTENT AREA
        ------------------------------------------------ */
        #content {
            min-height: 280px;
            display: flex;
            flex-direction: column;
        }

        /* ---- LOADING ---- */
        .loading-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #0A3D62;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
        }

        .loading-text i {
            color: #FDB913;
            margin-right: 6px;
        }

        /* ---- RESULT CARDS ---- */
        .result-card {
            padding: 24px 28px;
            border-radius: 16px;
            animation: fadeSlideUp 0.4s ease;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-valid {
            background: #f0fdf4;
            border-left: 5px solid #10b981;
        }

        .result-invalid {
            background: #fef2f2;
            border-left: 5px solid #dc2626;
        }

        .result-error {
            background: #fffbeb;
            border-left: 5px solid #f59e0b;
        }

        .result-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-title.valid { color: #065f46; }
        .result-title.invalid { color: #991b1b; }
        .result-title.error { color: #92400e; }

        .result-title i {
            font-size: 24px;
        }

        /* ---- DETAIL ROWS ---- */
        .detail-grid {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin: 8px 0 4px;
        }

        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #475569;
            width: 140px;
            flex-shrink: 0;
            font-size: 14px;
        }

        .detail-value {
            color: #0A3D62;
            font-weight: 500;
            font-size: 14px;
            word-break: break-word;
        }

        .detail-value.highlight {
            font-weight: 700;
            color: #0A3D62;
        }

        /* ---- VERIFICATION BADGE ---- */
        .verification-badge {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .verification-badge.success {
            background: #d1fae5;
            color: #065f46;
        }

        .verification-badge.fail {
            background: #fecaca;
            color: #991b1b;
        }

        .verification-badge i {
            font-size: 16px;
        }

        /* ---- ERROR MESSAGE ---- */
        .error-message {
            margin-top: 12px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            color: #64748b;
            border: 1px solid #e5e7eb;
            word-break: break-all;
        }

        .error-message strong {
            color: #dc2626;
        }

        /* ---- INVALID LIST ---- */
        .invalid-list {
            color: #64748b;
            font-size: 14px;
            margin: 8px 0 0 20px;
            line-height: 1.7;
        }

        /* ----------------------------------------------
            FOOTER
        ------------------------------------------------ */
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .footer a {
            color: #0A3D62;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #FDB913;
        }

        .footer .divider {
            display: inline-block;
            margin: 0 6px;
            color: #d1d5db;
        }

        .footer .grad-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f8fafc;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: #0A3D62;
            border: 1px solid #e5e7eb;
            margin-top: 6px;
        }

        .footer .grad-badge i {
            color: #FDB913;
        }

        /* ----------------------------------------------
            RESPONSIVE
        ------------------------------------------------ */
        @media (max-width: 600px) {
            .container {
                padding: 24px 20px 20px;
                border-radius: 20px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .logo {
                justify-content: center;
            }

            .badge {
                margin-left: 0;
                justify-content: center;
                padding: 5px 14px;
                font-size: 11px;
            }

            .logo-text {
                font-size: 20px;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .result-title {
                font-size: 18px;
            }

            .detail-row {
                flex-direction: column;
                gap: 2px;
                padding: 6px 0;
            }

            .detail-label {
                width: 100%;
                font-size: 12px;
                color: #64748b;
            }

            .detail-value {
                font-size: 14px;
            }

            .result-card {
                padding: 16px 18px;
            }

            .footer {
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px 14px 16px;
            }

            .logo-text {
                font-size: 17px;
            }

            .badge {
                font-size: 10px;
                padding: 4px 12px;
            }

            .result-title {
                font-size: 16px;
            }
        }
    
        /* Refined verification experience */
        body {
            background:
                radial-gradient(ellipse at top left, rgba(253,185,19,.13), transparent 35%),
                radial-gradient(ellipse at bottom right, rgba(10,61,98,.12), transparent 40%),
                #eef3f8;
            padding: clamp(14px, 3vw, 36px);
            color: #183247;
        }
        .container {
            max-width: 900px;
            min-height: min(760px, calc(100vh - 48px));
            display: flex;
            flex-direction: column;
            padding: clamp(22px, 4vw, 48px);
            border: 1px solid rgba(203, 216, 228, .85);
            border-radius: 26px;
            box-shadow: 0 28px 80px rgba(10, 42, 66, .13);
        }
        .header {
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 24px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e4ebf2;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            font-size: 25px;
        }
        .logo-text { font-size: clamp(22px, 3vw, 28px); }
        .logo-sub { font-size: 12px; line-height: 1.5; }
        .badge {
            padding: 10px 16px;
            font-size: 12px;
            letter-spacing: .1px;
            white-space: normal;
            text-align: center;
        }
        #content { flex: 1; min-height: 300px; }
        .result-card {
            padding: clamp(22px, 4vw, 36px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15, 45, 70, .06);
        }
        .result-title { font-size: clamp(21px, 3vw, 29px); line-height: 1.25; }
        .result-card p { line-height: 1.65; font-size: 15px; }
        .detail-grid {
            margin-top: 22px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 22px;
            padding: 18px 20px;
            background: rgba(255,255,255,.72);
            border: 1px solid rgba(203,213,225,.75);
            border-radius: 14px;
        }
        .detail-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 13px 0;
            border-bottom: 1px solid #e8edf2;
            min-width: 0;
        }
        .detail-row strong {
            color: #64788a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .07em;
        }
        .detail-row span { color: #163d59; font-weight: 700; overflow-wrap: anywhere; }
        .footer {
            margin-top: 38px;
            padding-top: 22px;
            border-top: 1px solid #e4ebf2;
            color: #718096;
            text-align: center;
            line-height: 1.7;
        }
        .footer .institutional-footer {
            margin-top: 12px;
            padding: 14px 16px;
            background: #f5f8fb;
            border: 1px solid #e4ebf2;
            border-radius: 12px;
            color: #234760;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.7;
        }
        .footer .security-note { color: #718096; font-size: 12px; }
        .footer .grad-badge { margin-top: 12px; }
        @media (max-width: 600px) {
            body { padding: 12px; align-items: flex-start; }
            .container { min-height: calc(100vh - 24px); padding: 22px 18px; border-radius: 20px; }
            .header { align-items: flex-start; }
            .logo { align-items: center; }
            .logo-text { font-size: 22px; }
            .logo-sub { max-width: 240px; font-size: 10px; }
            .badge { margin: 0; width: 100%; justify-content: center; }
            .detail-grid { grid-template-columns: 1fr; padding: 12px 16px; }
            .footer { margin-top: 28px; font-size: 12px; }
            .footer .institutional-footer { font-size: 11px; }
        }
        .verified-marks { width:100%; margin-top:22px; border:1px solid #dce6ee; border-radius:14px; overflow:hidden; background:#fff; }
        .verified-marks h3 { padding:16px 18px; background:#0A3D62; color:#fff; font-size:16px; }
        .verified-marks .block-heading { padding:11px 14px; background:#edf4f8; color:#0A3D62; font-weight:800; font-size:12px; border-top:1px solid #dce6ee; }
        .verified-marks table { width:100%; border-collapse:collapse; font-size:13px; }
        .verified-marks th, .verified-marks td { text-align:left; padding:10px 12px; border-bottom:1px solid #e8eef3; }
        .verified-marks th { color:#52697a; background:#f8fafc; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
        .verified-marks td.score { font-weight:800; color:#0A3D62; white-space:nowrap; }
        .marks-note { padding:12px 14px; color:#63788a; font-size:11px; line-height:1.5; background:#f8fafc; }
        @media (max-width:600px) {
            .verified-marks { overflow-x:auto; }
            .verified-marks table { min-width:460px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }

        /* Premium, scan-first verification result */
        .verification-result { position: relative; isolation: isolate; }
        .verification-banner { position: relative; overflow: hidden; text-align: center; padding: 30px 22px 26px; border-radius: 22px; background: radial-gradient(circle at 50% 0%, rgba(16,185,129,.18), transparent 58%), linear-gradient(145deg,#073653,#0A3D62 58%,#145579); color: #fff; box-shadow: 0 18px 42px rgba(10,61,98,.22); animation: verifyPop .65s cubic-bezier(.2,.9,.2,1.15) both; }
        .verification-banner::before,.verification-banner::after { content:""; position:absolute; border:1px solid rgba(255,255,255,.13); border-radius:50%; width:230px;height:230px;top:-145px;left:-65px;pointer-events:none; }
        .verification-banner::after { width:300px;height:300px;top:auto;left:auto;right:-180px;bottom:-220px; }
        .verification-emblem { position:relative; z-index:1; display:grid;place-items:center;width:76px;height:76px;margin:0 auto 14px;border-radius:50%;font-size:36px;color:#fff;background:linear-gradient(145deg,#22c55e,#059669);border:5px solid rgba(255,255,255,.9);box-shadow:0 0 0 8px rgba(34,197,94,.2),0 10px 24px rgba(0,0,0,.2); }
        .verification-result.is-review .verification-emblem { background:linear-gradient(145deg,#fbbf24,#d97706); }
        .verification-result.is-invalid .verification-emblem { background:linear-gradient(145deg,#fb7185,#dc2626); }
        .verification-eyebrow { position:relative;z-index:1;font-size:10px;font-weight:800;letter-spacing:2px;color:#a7f3d0;margin-bottom:8px; }
        .verification-headline { position:relative;z-index:1;font-size:clamp(25px,5vw,36px);line-height:1.12;letter-spacing:-1px;font-weight:900;color:#fff;margin:0 0 12px; }
        .verification-message { position:relative;z-index:1;max-width:520px;margin:0 auto;color:#e2e8f0;font-size:14px;line-height:1.7; }
        .verified-seal { position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:9px 16px;border:1px solid rgba(167,243,208,.5);border-radius:999px;background:rgba(6,95,70,.45);color:#d1fae5;font-size:11px;font-weight:900;letter-spacing:1.2px; }
        .result-card { margin-top:18px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 12px 30px rgba(10,61,98,.07); }
        .result-valid { border-left:5px solid #10b981; }
        .result-error { background:#fffbeb;border-left:5px solid #f59e0b; }
        .result-invalid { background:#fff5f5;border-left:5px solid #dc2626; }
        .result-title { font-size:17px; }
        .detail-grid { margin-top:12px;gap:0; }
        .detail-row { align-items:flex-start;gap:14px;padding:12px 4px;border-bottom:1px solid #edf2f7; }
        .detail-row strong { width:155px;flex:0 0 155px;color:#64748b;font-size:12px; }
        .detail-row span { flex:1;color:#0A3D62;font-weight:700;font-size:13px;overflow-wrap:anywhere; }
        .verification-footnote { display:flex;justify-content:center;align-items:center;gap:8px;text-align:center;margin:18px 0 0;color:#64748b;font-size:11px;line-height:1.6; }
        .verification-footnote i { color:#0A3D62; }
        .verification-confetti { position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5; }
        .verification-confetti span { position:absolute;top:-12px;left:calc((var(--i) * 37) % 100 * 1%);width:7px;height:12px;border-radius:2px;background:hsl(calc(var(--i) * 47),75%,55%);animation:confettiFall 1.8s ease-in forwards;animation-delay:calc(var(--i) * 18ms); }
        @keyframes confettiFall { to { transform:translate3d(20px,420px,0) rotate(680deg);opacity:0; } }
        @keyframes verifyPop { from { opacity:0;transform:translateY(18px) scale(.97); } to { opacity:1;transform:translateY(0) scale(1); } }
        @media(max-width:600px) { .verification-banner{padding:26px 16px 22px;border-radius:18px}.verification-emblem{width:66px;height:66px;font-size:30px}.verification-eyebrow{font-size:9px;letter-spacing:1.3px}.verification-headline{font-size:27px}.detail-row{flex-direction:row;gap:10px}.detail-row strong{width:115px;flex:0 0 115px;font-size:11px}.detail-row span{font-size:12px}.result-card{padding:18px 16px} }
        @media(prefers-reduced-motion:reduce) { .verification-banner{animation:none}.verification-confetti{display:none} .verification-confetti span{animation:none} }
    </style>
</head>
<body>

<div class="container">

    <!-- ============================================
    HEADER
    ============================================ -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">N</div>
            <div>
                <div class="logo-text">NCHSM <span>🎓</span></div>
                <div class="logo-sub">Nakuru College of Health Sciences and Management</div>
            </div>
        </div>
        <div class="badge">
            <i class="fas fa-certificate"></i> Academic Records Verification
        </div>
    </div>

    <!-- ============================================
    CONTENT
    ============================================ -->
    <div id="content">

        <!-- LOADING STATE (visible by default) -->
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <div class="loading-text">
                <i class="fas fa-spinner fa-spin"></i> Verifying academic transcript...
            </div>
        </div>

        <!-- RESULT STATE (hidden by default) -->
        <div id="resultState" style="display: none;"></div>

    </div>

    <!-- ============================================
    FOOTER
    ============================================ -->
    <div class="footer">
        <div class="security-note">
            <i class="fas fa-shield-alt" aria-hidden="true"></i>
            Secure academic transcript verification
        </div>
        <div class="institutional-footer">
            Accredited &amp; Registered Institution <span class="divider">|</span>
            Committed to Academic Excellence <span class="divider">|</span>
            © 2026 Nakuru College of Health Sciences &amp; Management
        </div>
    </div>

</div>

<!-- ============================================
JAVASCRIPT
============================================ -->
<script src="/config.js"></script>
<script>
    (async function() {
        'use strict';
        function escapeVerificationText(value) {
            return String(value || '').replace(/[&<>"']/g, function(ch) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
            });
        }
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const legacyId = params.get('id') || '';
        const loadingState = document.getElementById('loadingState');
        const resultState = document.getElementById('resultState');
        const config = window.APP_CONFIG || {};
        function showResult(kind, title, message, detailsHtml = '') {
            loadingState.style.display = 'none';
            resultState.style.display = 'block';
            resultState.className = 'verification-result ' + (kind === 'valid' ? 'is-verified' : (kind === 'error' ? 'is-review' : 'is-invalid'));
            const icon = kind === 'valid' ? 'fa-circle-check' : (kind === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-exclamation');
            const resultClass = kind === 'valid' ? 'result-valid' : (kind === 'error' ? 'result-error' : 'result-invalid');
            const titleClass = kind === 'valid' ? 'valid' : (kind === 'error' ? 'error' : 'invalid');
            resultState.innerHTML = `
                <div class="verification-banner" role="status" aria-live="polite">
                    <div class="verification-emblem"><i class="fas ${icon}" aria-hidden="true"></i></div>
                    <div class="verification-eyebrow">${kind === 'valid' ? 'AUTHENTIC RECORD CONFIRMED' : (kind === 'error' ? 'REVIEW REQUIRED' : 'VERIFICATION UNSUCCESSFUL')}</div>
                    <h1 class="verification-headline">${escapeVerificationText(title)}</h1>
                    <p class="verification-message">${escapeVerificationText(message)}</p>
                    ${kind === 'valid' ? '<div class="verified-seal"><i class="fas fa-shield-check" aria-hidden="true"></i> NCHSM VERIFIED</div>' : ''}
                </div>
                <div class="result-card ${resultClass}">
                    <div class="result-title ${titleClass}"><i class="fas ${icon}" aria-hidden="true"></i> Verification Details</div>
                    ${detailsHtml ? '<div class="detail-grid">' + detailsHtml + '</div>' : ''}
                </div>
                <div class="verification-footnote"><i class="fas fa-lock" aria-hidden="true"></i> Verification is based on the college registry and current published academic results.</div>`;
            if (kind === 'valid') {
                resultState.scrollIntoView({ behavior: 'smooth', block: 'start' });
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const confetti = document.createElement('div');
                confetti.className = 'verification-confetti';
                confetti.setAttribute('aria-hidden', 'true');
                confetti.innerHTML = Array.from({ length: 28 }, (_, i) => '<span style="--i:' + i + '"></span>').join('');
                resultState.appendChild(confetti);
                window.setTimeout(() => confetti.remove(), 2200);
            }
        }
        function detail(label, value) {
            return '<div class="detail-row"><strong>' + escapeVerificationText(label) + '</strong><span>' + escapeVerificationText(value || '—') + '</span></div>';
        }
        if (!token) {
            if (legacyId) {
                showResult('error', 'Registry lookup required',
                    'This QR code uses an older format and does not contain a secure registry token. Generate a fresh transcript preview to obtain a new verification QR code.',
                    detail('Reference', legacyId));
            } else {
                showResult('invalid', 'Missing verification token',
                    'This QR code does not contain a valid registry token. Please contact the NCHSM Academic Office.');
            }
            return;
        }
        if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) {
            showResult('error', 'Verification service unavailable',
                'The public registry configuration could not be loaded. Please try again later or contact the Academic Office.');
            return;
        }
        try {
            const response = await fetch(String(config.SUPABASE_URL).replace(/\/$/, '') + '/functions/v1/transcript-registry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': config.SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: 'verify', token })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.error || 'The registry could not be reached.');
            const details = detail('Document type', 'Provisional academic transcript') +
                detail('Transcript generation number', result.transcript_number || 'Not available on this registry record') +
                detail('Student name', result.student_name) +
                detail('Admission number', result.student_id) +
                detail('Program', result.program) +
                detail('Intake year', result.intake_year || 'Not recorded') +
                detail('Current block', result.current_block || 'Not recorded') +
                detail('Registry issue date', result.issued_at ? new Date(result.issued_at).toLocaleString() : '');
            const blockNames = Array.isArray(result.blocks)
                ? result.blocks.map(function(block) { return String(block || '').trim(); }).filter(Boolean)
                : [];
            const blockDetail = blockNames.length
                ? detail('Marks included for block', blockNames.join(', '))
                : detail('Marks included for block', result.block || result.transcript_block || 'Not specified on registry record');
            const verificationDetails = details + blockDetail;
            if (result.status === 'verified') showResult('valid', 'Transcript Verified', result.message, verificationDetails);
            else if (result.status === 'record_changed') showResult('error', 'Academic record requires review', result.message, verificationDetails);
            else showResult('invalid', 'Transcript not verified', result.message || 'No active registry record matches this QR code.');
        } catch (error) {
            console.error('Transcript registry verification failed:', error);
            showResult('error', 'Verification service unavailable',
                error && error.message ? error.message : 'Could not contact the NCHSM document registry. Please try again later.');
        }
    })();
</script>

</body>
</html>
