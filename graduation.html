</div>

<script>

(function() {

    'use strict';


    /* =========================================================
       YOUR REAL GOOGLE APPS SCRIPT WEB APP
    ========================================================= */

    const APPS_SCRIPT_URL =
        'https://script.google.com/macros/s/AKfycbydmwYqgkMHZa1L8IUXA8wg6QmzJEa69FYpgtvIg1J9IoE9QCQacEFmwHz_sviWAGr9kw/exec';


    /* =========================================================
       PUBLIC NCHSM URL
    ========================================================= */

    const PUBLIC_URL =
        'https://nchsm.co.ke/graduation';


    /* =========================================================
       DOM
    ========================================================= */

    const loadingState =
        document.getElementById(
            'loadingState'
        );


    const resultState =
        document.getElementById(
            'resultState'
        );


    /* =========================================================
       GET CERTIFICATE ID
    ========================================================= */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const certificateId =
        urlParams.get('id');


    /* =========================================================
       NO CERTIFICATE ID
    ========================================================= */

    if (!certificateId) {

        loadingState.style.display =
            'none';


        resultState.style.display =
            'block';


        resultState.innerHTML = `

            <div class="result-card result-info">

                <div class="result-title info">

                    <i class="fas fa-qrcode"></i>

                    Certificate Verification

                </div>


                <p
                    style="
                        color:#64748b;
                        line-height:1.7;
                    "
                >

                    Please scan the QR code printed
                    on an NCHSM certificate to verify
                    its authenticity.

                </p>


                <p
                    style="
                        color:#94a3b8;
                        margin-top:10px;
                        font-size:13px;
                    "
                >

                    Each certificate has a unique
                    verification link.

                </p>

            </div>

        `;


        return;

    }


    /* =========================================================
       CLEAN ID
    ========================================================= */

    const cleanId =
        String(certificateId)
            .trim();


    /* =========================================================
       SHOW REDIRECT MESSAGE
    ========================================================= */

    setTimeout(function() {

        loadingState.style.display =
            'none';


        resultState.style.display =
            'block';


        resultState.innerHTML = `

            <div class="result-card result-info">

                <div class="result-title info">

                    <i class="fas fa-shield-alt"></i>

                    Official Certificate Verification

                </div>


                <p
                    style="
                        color:#64748b;
                        line-height:1.7;
                    "
                >

                    Certificate

                    <strong
                        style="color:#0A3D62;"
                    >
                        ${escapeHtml(cleanId)}
                    </strong>

                    is being verified through
                    the official NCHSM verification system.

                </p>


                <div
                    style="
                        margin-top:16px;
                        display:flex;
                        justify-content:center;
                    "
                >

                    <div
                        class="spinner"
                        style="
                            width:34px;
                            height:34px;
                            margin:0;
                        "
                    ></div>

                </div>

            </div>

        `;


    }, 300);


    /* =========================================================
       REDIRECT TO APPS SCRIPT
    *
    * IMPORTANT:
    * We use window.location instead of fetch().
    *
    * This avoids the CORS problem.
    ========================================================= */

    const backendUrl =
        APPS_SCRIPT_URL +
        '?id=' +
        encodeURIComponent(
            cleanId
        );


    setTimeout(function() {

        window.location.href =
            backendUrl;

    }, 900);


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHtml(str) {

        if (!str) {
            return '';
        }


        const map = {

            '&': '&amp;',

            '<': '&lt;',

            '>': '&gt;',

            '"': '&quot;',

            "'": '&#039;'

        };


        return String(str).replace(
            /[&<>"']/g,
            function(m) {

                return map[m];

            }
        );

    }


})();

</script>
