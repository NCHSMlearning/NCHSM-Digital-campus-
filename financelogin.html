<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Module Login - NCHSM</title>
    
    <!-- ===== SUPABASE - Using same working CDN ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <!-- ===== FONT AWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/NCHSMlearning/e-learning/main/images/Logo_NCHSM.png" sizes="32x32">

    <style>
        /* ============================================================ */
        /* FINANCE LOGIN - ALL STYLES INLINE                           */
        /* ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0A3D62 0%, #1a5a7a 50%, #2d7a9e 100%);
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .institution-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 2rem;
            color: #0A3D62;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-icon img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 50%;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
        }

        .logo-text span {
            color: #FDB913;
        }

        .logo-subtext {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-2px);
        }

        .login-header {
            background: linear-gradient(135deg, #0A3D62 0%, #073450 100%);
            padding: 28px 30px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FDB913, #4C1D95, #FDB913);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            background: rgba(76, 29, 149, 0.3);
            color: #c4b5fd;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .login-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #0A3D62;
            font-size: 0.85rem;
        }

        .form-group label .required {
            color: #DC2626;
            margin-left: 2px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s;
            background: #F8FAFC;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4C1D95;
            background: white;
            box-shadow: 0 0 0 4px rgba(76, 29, 149, 0.1);
        }

        .form-group input::placeholder {
            color: #94A3B8;
            font-size: 0.85rem;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #4C1D95;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4C1D95, #6d28d9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 29, 149, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #FEE2E2;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-weight: 500;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #DC2626;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 1.1rem;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #E2E8F0;
            font-size: 0.75rem;
            color: #94A3B8;
        }

        .login-footer .contact-link {
            color: #4C1D95;
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer .contact-link:hover {
            text-decoration: underline;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: #F8FAFC;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #64748B;
            margin-top: 8px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @media (max-width: 480px) {
            .login-body {
                padding: 20px;
            }
            .login-header {
                padding: 20px;
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
            .logo-text {
                font-size: 1.4rem;
            }
            .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 1.5rem;
            }
            .logo-icon img {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="institution-logo">
            <div class="logo-icon">
                <img src="https://raw.githubusercontent.com/NCHSMlearning/e-learning/main/images/Logo_NCHSM.png" alt="NCHSM Logo" onerror="this.innerHTML='<i class=\'fas fa-coins\'></i>'">
            </div>
            <div class="logo-text">NCHSM <span>Finance</span></div>
            <div class="logo-subtext">Financial Management System</div>
        </div>

        <div class="login-container">
            <div class="login-header">
                <h1><i class="fas fa-lock"></i> Finance Portal</h1>
                <p>Access financial management dashboard</p>
                <div class="status-badge">
                    <i class="fas fa-shield-alt"></i> Secure Access
                </div>
            </div>

            <div class="login-body">
                <div id="errorMessage" class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Invalid credentials</span>
                </div>

                <div class="form-group">
                    <label for="email">
                        Email Address <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="Enter your email"
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-key"></i></span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" id="togglePasswordBtn">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="login-btn" id="loginBtn">
                    <span class="spinner"><i class="fas fa-spinner"></i></span>
                    <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login to Finance Dashboard</span>
                </button>

                <div class="login-footer">
                    <p>⚠️ Restricted access. Finance personnel only.</p>
                    <p style="margin-top: 4px;">
                        <i class="fas fa-shield-alt" style="color: #10B981;"></i>
                        Encrypted connection · All actions are logged
                    </p>
                    <div class="security-badge">
                        <i class="fas fa-check-circle" style="color: #10B981;"></i>
                        SSL Secure
                    </div>
                    <p style="margin-top: 8px; font-size: 0.7rem;">
                        <a href="#" class="contact-link" onclick="showHelp()">Contact Support</a>
                        &nbsp;·&nbsp;
                        <a href="#" class="contact-link">Privacy Policy</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
<script src="code-protection.js"></script>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT - USING SAME WORKING PATTERN ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // HIDE .html EXTENSION
        // ============================================================
        if (window.location.pathname.endsWith('.html')) {
            const cleanPath = window.location.pathname.replace(/\.html$/, '');
            window.history.replaceState({}, '', cleanPath);
        }

        // ============================================================
        // 🔧 SUPABASE CONFIG (Using window to avoid duplicate declaration)
        // ============================================================
        const SUPABASE_URL = 'https://lwhtjozfsmbyihenfunw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3aHRqb3pmc21ieWloZW5mdW53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2NTgxMjcsImV4cCI6MjA3NTIzNDEyN30.7Z8AYvPQwTAEEEhODlW6Xk-IR1FK3Uj5ivZS7P17Wpk';

        // ✅ Use a different variable name to avoid conflict
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        // ============================================================
        // 👁️ TOGGLE PASSWORD VISIBILITY
        // ============================================================
        togglePasswordBtn.addEventListener('click', function() {
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // ============================================================
        // 🔐 LOGIN FUNCTION
        // ============================================================
        async function login() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            errorDiv.classList.remove('show');

            if (!email || !password) {
                errorText.textContent = 'Please enter both email and password';
                errorDiv.classList.add('show');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                console.log('🔐 Attempting login for:', email);

                // ✅ Use supabaseClient instead of supabase
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    console.error('❌ Auth error:', authError);
                    throw new Error('Invalid email or password');
                }

                console.log('✅ Auth successful');

                // Get user profile from consolidated_user_profiles_table
                const { data: profile, error: profileError } = await supabaseClient
                    .from('consolidated_user_profiles_table')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (profileError || !profile) {
                    console.error('❌ Profile error:', profileError);
                    await supabaseClient.auth.signOut();
                    throw new Error('Account not found. Please contact administrator.');
                }

                console.log('📋 Profile found:', profile.full_name);
                console.log('🔑 Role:', profile.role);

                // ✅ Check for finance roles: superadmin or finance_officer
                const userRole = (profile.role || '').toLowerCase();
                const financeRoles = ['superadmin', 'finance_officer'];

                if (!financeRoles.includes(userRole)) {
                    console.error('❌ Invalid role:', userRole);
                    await supabaseClient.auth.signOut();
                    throw new Error('Access denied. You do not have finance privileges.');
                }

                console.log('✅ Finance access granted!');

                // Store user data
                const financeUser = {
                    id: profile.id,
                    email: profile.email,
                    name: profile.full_name || profile.name || 'Finance Officer',
                    role: userRole,
                    student_id: profile.student_id || null,
                    program: profile.program || null,
                    phone: profile.phone || null,
                    loggedInAt: new Date().toISOString(),
                    token: authData.session?.access_token || null
                };

                localStorage.setItem('finance_user', JSON.stringify(financeUser));

                // Show success and redirect
                errorDiv.classList.remove('show');
                
                // Show success toast
                const successMsg = document.createElement('div');
                successMsg.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #10B981;
                    color: white;
                    padding: 16px 24px;
                    border-radius: 10px;
                    font-weight: 500;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                    z-index: 9999;
                    animation: slideIn 0.3s ease;
                    font-family: 'Segoe UI', sans-serif;
                `;
                successMsg.innerHTML = `<i class="fas fa-check-circle"></i> Welcome ${financeUser.name}! Redirecting...`;
                document.body.appendChild(successMsg);

                setTimeout(() => {
                    window.location.href = 'finance.html';
                }, 1200);

            } catch (error) {
                console.error('❌ Login error:', error);
                errorText.textContent = error.message || 'Login failed. Please try again.';
                errorDiv.classList.add('show');
                
                const loginContainer = document.querySelector('.login-container');
                loginContainer.classList.remove('shake');
                void loginContainer.offsetWidth;
                loginContainer.classList.add('shake');
                
                passwordInput.value = '';
                passwordInput.focus();
                
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }

        // ============================================================
        // 🔗 EVENT LISTENERS
        // ============================================================
        loginBtn.addEventListener('click', login);

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // ============================================================
        // 🚀 DOM READY
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            emailInput.focus();

            // Check if already logged in
            const session = localStorage.getItem('finance_user');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    const loggedInAt = new Date(data.loggedInAt);
                    const now = new Date();
                    const hoursDiff = (now - loggedInAt) / (1000 * 60 * 60);
                    
                    if (hoursDiff < 24) {
                        window.location.href = 'finance.html';
                    } else {
                        localStorage.removeItem('finance_user');
                    }
                } catch (e) {
                    localStorage.removeItem('finance_user');
                }
            }
        });

        // ============================================================
        // 🆘 HELP
        // ============================================================
        function showHelp() {
            alert('📧 Contact support at support@nchsm.ac.ke or call +254 700 000 000');
        }

        // ============================================================
        // 📋 ADD SLIDE IN ANIMATION
        // ============================================================
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes slideIn {
                from { transform: translateX(20px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(styleSheet);

        console.log('%c💰 Finance Login System', 'color: #4C1D95; font-size: 16px; font-weight: bold;');
        console.log('%c✅ Using supabaseClient to avoid conflicts', 'color: #38A169;');
        console.log('%c🔑 Requires superadmin or finance_officer role', 'color: #F59E0B;');
        console.log('%c📋 Table: consolidated_user_profiles_table', 'color: #3B82F6;');
    </script>
</body>
</html>
